<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ToneBox</h1>
    <p>Tone control and speaker box calculator</p>
    <div class="controls">
        <div class="control">
            <label for="bass">Bass</label>
            <input type="range" id="bass" min="-12" max="12" step="0.5" value="0">
            <span id="bassValue">0 dB</span>
        </div>
         <div class="control">
         <label for="treble">Treble</label>
         <input type="range" id="treble" min="-12" max="12" step="O.5" value="0">
         <span id="trebleValue">0 dB</span>
        </div>
    </div>
   
    <canvas id="graph" width="800" height="400"></canvas>
  <script src="code.js"></script>  
</body>
</html>
