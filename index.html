<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToneBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ToneBox</h1>
    <p>Tone control and speaker box calculator</p>
    <div class="controls">
            <div class="control">
                <label for="bass">Bass</label>
                <input type="range" id="bass" min="-12" max="12" step="0.5" value="0">
                <span id="bassValue">0 dB</span>
            </div>
                <div class="control">
                    <label for="mid">Mid</label>
                    <input type="range" id="mid" min="-12" max="12" step="0.5" value="0">
                    <span id="midValue">0 dB</span>
                </div>
         <div class="control">
         <label for="treble">Treble</label>
         <input type="range" id="treble" min="-12" max="12" step="0.5" value="0">
         <span id="trebleValue">0 dB</span>
        </div>
    </div>
    <div class="design">
        <h2>Design</h2>
        <div class="field">
            <label for="mode">Mode</label>
            <select id="mode">
                <option value="design">Design (from frequencies)</option>
                <option value="analyze">Analyze (my components)</option>
            </select>
        </div>
        <div class="field">
            <label for="potValue">Pot value (kΩ)</label>
            <input type="number" id="potValue" value="100">
        </div>
            <div id="designFields">
                    <div class="field">
                    <label for="maxBoost">Max boost (dB)</label>
                    <input type="number" id="maxBoost" value="12">
                </div>
                <div class="field">
                    <label for="bassFreq">Bass freq (Hz)</label>
                    <input type="number" id="bassFreq" value="100">
                </div>
                <div class="field">
                    <label for="midFreq">Mid freq (Hz)</label>
                    <input type="number" id="midFreq" value="1000">
                </div>
                <div class="field">
                    <label for="trebleFreq">Treble freq (Hz)</label>
                    <input type="number" id="trebleFreq" value="10000">
                </div>
            </div>
            <div id="analyzeFields">
                    <div class="field">
                        <label for="r1Input">R1 (kΩ)</label>
                        <input type="number" id="r1Input" value="33">
                    </div>
                    <div class="field">
                        <label for="cBassInput">C bass (nF)</label>
                        <input type="number" id="cBassInput" value="27">
                    </div>
                    <div class="field">
                        <label for="cMidInput">C mid (nF)</label>
                        <input type="number" id="cMidInput" value="4.7" step="0.1">
                    </div>
                    <div class="field">
                        <label for="cTrebleInput">C treble (nF)</label>
                        <input type="number" id="cTrebleInput" value="0.27">
                    </div>
                </div>
        <div class="field">
            <label for="channels">Channels</label>
            <input type="number" id="channels" value="2" min="1">
        </div>
    </div>

        <div id="results"></div>
        <div id="bom"></div>
        <div class="design">
            <h2>Speaker box</h2>
            <div class="field">
                <label for="boxType">Box type</label>
                <select id="boxType">
                    <option value="closed">Closed</option>
                    <option value="ported">Ported (bass reflex)</option>
                </select>
            </div>
            <div class="field">
                <label for="fs">Fs (Hz)</label>
                <input type="number" id="fs" value="40">
            </div>
            <div class="field">
                <label for="qts">Qts</label>
                <input type="number" id="qts" value="0.4" step="0.01">
            </div>
            <div class="field">
                <label for="vas">Vas (L)</label>
                <input type="number" id="vas" value="50">
            </div>
            <div class="field" id="qtcField">
                <label for="qtc">Target Qtc</label>
                <input type="number" id="qtc" value="0.707" step="0.01">
            </div>
            <div class="field" id="portField">
                <label for="portDiam">Port diameter (cm)</label>
                <input type="number" id="portDiam" value="7.5" step="0.5">
            </div>
        </div>
        <div id="boxResults"></div>
   
    <canvas id="graph" width="800" height="400"></canvas>
    <canvas id="schematic" width="760" height="360"></canvas>
  <script src="code.js"></script>  
</body>
</html>
